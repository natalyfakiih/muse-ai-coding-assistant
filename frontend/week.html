<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSE — my week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/static/css/home.css?v=20261010c">
<link rel="stylesheet" href="/static/css/week.css?v=20261009e">
</head>
<body>

<div class="shell">

  <!-- ================= SIDEBAR ================= -->
  <aside class="side">
    <a class="logo" href="/" aria-label="MUSE home">
      <span class="logo-word">muse</span>
      <svg class="logo-sprout" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 29V15" />
        <path d="M16 17c0-5 3.5-8.5 9-8.5 0 5.5-3.5 8.5-9 8.5z" />
        <path d="M16 20c-.5-4-3.5-6.5-8-6.5 0 4.2 3 6.5 8 6.5z" />
      </svg>
    </a>
    <div class="logo-tag">A little better, every day</div>

    <nav class="nav" aria-label="Student">
      <a class="nav-item" href="/">
        <svg class="ico ico-home-muted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19z"/>
        </svg>
        <span>My overview</span>
      </a>
      <a class="nav-item" href="/learning">
        <svg class="ico ico-book" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 5c3-1.3 6.3-1.3 9.5.8v14c-3.2-2.1-6.5-2.1-9.5-.8z"/>
          <path d="M21.5 5c-3-1.3-6.3-1.3-9.5.8v14c3.2-2.1 6.5-2.1 9.5-.8z"/>
        </svg>
        <span>My learning</span>
      </a>
      <a class="nav-item" href="/progress">
        <svg class="ico ico-bars" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20v-6"/><path d="M12 20V9"/><path d="M19 20V4"/>
        </svg>
        <span>My progress</span>
      </a>
      <a class="nav-item active" href="/week" aria-current="page">
        <svg class="ico ico-cal" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
          <path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/>
          <g class="dots"><circle cx="8" cy="13" r=".9"/><circle cx="12" cy="13" r=".9"/><circle cx="16" cy="13" r=".9"/>
          <circle cx="8" cy="16.5" r=".9"/><circle cx="12" cy="16.5" r=".9"/><circle cx="16" cy="16.5" r=".9"/></g>
        </svg>
        <span>My week</span>
      </a>
      <a class="nav-item" href="/chat">
        <svg class="ico ico-chat" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5c5 0 9 3.4 9 7.8s-4 7.8-9 7.8c-1.2 0-2.3-.2-3.4-.5L3.5 20.5l1.6-4.2C3.8 14.9 3 13.2 3 11.3 3 6.9 7 3.5 12 3.5z"/>
        </svg>
        <span>Chat with Ollie</span>
      </a>
    </nav>
    <a class="side-switch" href="/instructor" aria-label="Switch to teacher view">
      <span class="ss-top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3"/><path d="M17 17H6l3 3"/></svg>
        Teacher view
      </span>
      <span class="ss-more">See the class dashboard →</span>
    </a>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <header class="topbar">
      <div class="crumbs">
        <span class="crumb-muted">My space</span>
        <svg class="crumb-sep" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        <span class="crumb-current">My week</span>
      </div>

      <div class="top-stats">
        <div class="stat stat-streak" title="Day streak">
          <svg class="flame" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5c.6 3-1 4.8-2.6 6.6C7.8 10.9 6 12.8 6 15.6 6 19 8.7 21.5 12 21.5s6-2.5 6-5.9c0-2.4-1.1-4.2-2.2-5.4-.3 1.3-1 2.2-2 2.6.3-3.6-.5-7.3-1.8-10.3z"/>
            <path class="flame-in" d="M12 21.5c-1.7 0-3-1.3-3-3 0-1.8 1.5-2.7 2.3-4 .9 1.1 3.7 2.2 3.7 4 0 1.7-1.3 3-3 3z"/>
          </svg>
          <span id="top-streak">7</span>
        </div>
        <div class="stat stat-xp" title="Experience points">
          <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 2.5 4.5 13.5h7l-1 8 9-11h-7z"/>
          </svg>
          <span><span id="top-xp">240</span> XP</span>
        </div>
        <button class="bell" type="button" aria-label="Notifications (1 new)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
          </svg>
          <span class="bell-dot"></span>
        </button>
        <div class="avatar" id="avatar" aria-label="Nataly">N</div>
      </div>
    </header>

    <main class="content">

      <div class="greet-row">
        <div>
          <h1 class="greet">A week of little possibilities
            <span class="sprout" aria-hidden="true">🗓️</span></h1>
          <p class="greet-sub"><span id="week-range">October 5–11</span> · A little room for learning. Plenty of room for you.</p>
        </div>
        <div class="date">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
            <path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/>
            <circle cx="8" cy="13" r=".7"/><circle cx="12" cy="13" r=".7"/><circle cx="16" cy="13" r=".7"/>
            <circle cx="8" cy="16.5" r=".7"/><circle cx="12" cy="16.5" r=".7"/>
          </svg>
          <span id="today">Friday, October 9</span>
        </div>
      </div>

      <!-- One small session a day, Monday to Sunday. Each row opens the real
           note or exercise in /learn. -->
      <ol class="plan" id="plan"></ol>

    </main>
  </div>
</div>

<script src="/static/js/home.js?v=20261009e"></script>
<script src="/static/js/week.js?v=20261009e"></script>
</body>
</html>
